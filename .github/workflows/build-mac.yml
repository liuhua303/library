name: Build Mac arm64
run-name: Mac arm64 · ${{ inputs.mode }} · ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "trial: ad-hoc 试用包；release: 正式签名并公证"
        required: true
        type: choice
        default: trial
        options:
          - trial
          - release

permissions:
  contents: read

concurrency:
  group: mac-arm64-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Require an Apple Silicon Mac
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          assert.equal(process.platform, 'darwin', 'macOS runner required');
          assert.equal(process.arch, 'arm64', 'Apple Silicon arm64 runner required');
          console.log(`Build host: ${process.platform}/${process.arch}, Node ${process.version}`);
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: |
          mkdir -p artifacts
          npm test -- --reporter=default --reporter=json --outputFile=artifacts/unit-results.json

      - name: Build trial DMG
        if: inputs.mode == 'trial'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist:mac:local

      - name: Build signed and notarized DMG
        if: inputs.mode == 'release'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          node --input-type=module <<'NODE'
          const required = ['CSC_LINK', 'CSC_KEY_PASSWORD', 'APPLE_ID', 'APPLE_APP_SPECIFIC_PASSWORD', 'APPLE_TEAM_ID'];
          const missing = required.filter(name => !process.env[name]);
          if (missing.length) throw new Error(`Missing repository Actions secrets: ${missing.join(', ')}`);
          NODE
          npm run dist:mac

      - name: Select output directory
        id: output
        env:
          BUILD_MODE: ${{ inputs.mode }}
        run: |
          case "$BUILD_MODE" in
            trial) printf 'directory=release/mac-arm64-local\n' >> "$GITHUB_OUTPUT" ;;
            release) printf 'directory=release/mac-arm64\n' >> "$GITHUB_OUTPUT" ;;
            *) printf 'Unsupported build mode\n' >&2; exit 1 ;;
          esac

      - name: Check packaged application
        env:
          MAC_OUTPUT: ${{ steps.output.outputs.directory }}
        run: node scripts/check-package.mjs "$MAC_OUTPUT/mac-arm64/阅间.app"

      - name: Check reading themes in packaged application
        env:
          MAC_OUTPUT: ${{ steps.output.outputs.directory }}
        run: node scripts/reading-preferences-smoke.mjs "$MAC_OUTPUT/mac-arm64/阅间.app/Contents/MacOS/阅间"

      - name: Record checksums and build identity
        env:
          MAC_OUTPUT: ${{ steps.output.outputs.directory }}
          BUILD_MODE: ${{ inputs.mode }}
        run: |
          shasum -a 256 "$MAC_OUTPUT"/*.dmg > "$MAC_OUTPUT/SHA256SUMS.txt"
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          const metadata = JSON.parse(await readFile('package.json', 'utf8'));
          const startup = JSON.parse(await readFile('artifacts/package-result.json', 'utf8'));
          const record = {
            version: metadata.version, commit: process.env.GITHUB_SHA,
            mode: process.env.BUILD_MODE, platform: process.platform, arch: process.arch,
            node: process.version, recordedAt: new Date().toISOString(),
            workflowRun: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
            packagedStartup: startup,
          };
          if (startup.version !== record.version) throw new Error('Packaged application version does not match source');
          await writeFile(`${process.env.MAC_OUTPUT}/build-info.json`, JSON.stringify(record, null, 2) + '\n');
          NODE
          if [ "$BUILD_MODE" = trial ]; then
            printf 'Trial DMG: ad-hoc signed, not notarized. This check does not verify Gatekeeper installation on another Mac.\n' >> "$GITHUB_STEP_SUMMARY"
          else
            printf 'Release DMG: built using Developer ID signing and notarization. Native user acceptance remains separate.\n' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload DMG
        uses: actions/upload-artifact@v7
        with:
          name: Yuejian-mac-arm64-${{ inputs.mode }}-${{ github.run_number }}
          path: |
            ${{ steps.output.outputs.directory }}/*.dmg
            ${{ steps.output.outputs.directory }}/SHA256SUMS.txt
            ${{ steps.output.outputs.directory }}/build-info.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Preserve check results
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: Mac-check-results-${{ inputs.mode }}-${{ github.run_number }}
          path: |
            artifacts/unit-results.json
            artifacts/package-result.json
            artifacts/packaged-startup.png
            artifacts/reading-preferences-result.json
            artifacts/preferences-notebook-*.png
          if-no-files-found: ignore
          retention-days: 14
